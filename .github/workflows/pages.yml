name: Publish old site to GitHub Pages

# Manual only: Actions cannot enable Pages (403). After Pages is turned on
# in repo settings (stara / root, or GitHub Actions source), run this job
# from the Actions tab if a deploy is still needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-old-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout old site (stara)
        uses: actions/checkout@v4
        with:
          ref: stara

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html polityka-prywatnosci.html favicon.svg robots.txt sitemap.xml _site/
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Enable GitHub Pages (Actions source)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type='workflow' >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type='workflow' >/dev/null || \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type='legacy' \
              -f source[branch]='stara' \
              -f source[path]='/' >/dev/null || true
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
